<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
:root{--green:#00C853;--gold:#FFD700;--dark:#0A0A0A;--card:#141414;--card2:#1E1E1E;--text:#F0F0F0;--muted:#888;--red:#FF3D3D;--border:#2A2A2A;--purple:#7C3AED;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;}

#ceo-login-screen{position:fixed;inset:0;background:#0A0A0A;z-index:9999;display:none;align-items:center;justify-content:center;}
.login-box{background:#141414;border:1px solid #2A2A2A;border-radius:20px;padding:40px 36px;width:100%;max-width:380px;text-align:center;}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;}
.login-logo svg{width:48px;height:48px;}
.brand{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:#00C853;letter-spacing:1px;line-height:1;}
.brand span{color:#FFD700;}
.sub{font-size:10px;color:#888;letter-spacing:2px;text-transform:uppercase;}
.login-box h2{font-family:'Oswald',sans-serif;font-size:20px;color:#F0F0F0;margin-bottom:6px;}
.login-box p{font-size:13px;color:#888;margin-bottom:24px;}
.login-field{margin-bottom:14px;text-align:left;}
.login-field label{display:block;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.login-field input{width:100%;background:#1E1E1E;border:1px solid #2A2A2A;color:#F0F0F0;padding:12px 14px;border-radius:8px;font-size:14px;outline:none;font-family:'Inter',sans-serif;transition:border-color 0.2s;}
.login-field input:focus{border-color:#7C3AED;}
.btn-ceo-login{width:100%;background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;border:none;padding:13px;border-radius:10px;font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;cursor:pointer;letter-spacing:1px;margin-top:6px;}
.login-error{color:#FF3D3D;font-size:13px;margin-top:10px;display:none;}
.login-back{margin-top:16px;font-size:13px;color:#888;}
.login-back a{color:#00C853;cursor:pointer;}

nav{background:#0D0D0D;border-bottom:2px solid var(--green);padding:0 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:64px;}
.nav-logo{display:flex;align-items:center;gap:10px;}
.nav-logo svg{width:36px;height:36px;}
.nav-logo-text .brand{font-size:20px;}
.nav-logo-text .sub{font-size:9px;}
.nav-links{display:flex;gap:4px;}
.nav-links button{background:none;border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border-radius:6px;cursor:pointer;transition:all 0.2s;}
.nav-links button:hover,.nav-links button.active{background:var(--green);color:#000;}
#admin-nav-btn{background:var(--purple);color:#fff;font-weight:600;display:none;}
#admin-nav-btn:hover{background:#6D28D9;color:#fff;}
.ceo-badge{background:linear-gradient(135deg,#7C3AED,#4F46E
